# Builds the downloads on the Releases page.
#
# Push a version tag (git tag v0.7.0 && git push origin v0.7.0) and this builds,
# tests and uploads to a DRAFT release:
#   AlterEgo-Setup-vX.Y.Z.exe              Windows installer
#   AlterEgo-vX.Y.Z-windows-portable.zip   Windows, unzip and run
#   AlterEgo-vX.Y.Z-linux-x86_64.tar.gz    Linux, unpack and run install.sh
# The release notes are the version's section of CHANGELOG.md. Nothing goes public
# by itself: check the draft on the Releases page, then click "Publish release".
# Until then it is hidden from users and from the in-app update check.
#
# "Run workflow" on the Actions tab does a dry run: the same builds, uploaded as
# workflow artifacts only, with no release.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.12"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-22.04  # An older glibc, so the build also runs on older distributions.
            platform: linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true  # The voice model in assets/voice/ is stored with Git LFS.

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Version
        id: version
        run: |
          VERSION=$(python -c "import re; print(re.search(r'\"(.+)\"', open('src/alter_ego/__init__.py').read()).group(1))")
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF#refs/tags/v}" != "$VERSION" ]]; then
            echo "Tag ${GITHUB_REF#refs/tags/} does not match __version__ $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: System libraries (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 \
            libdbus-1-3 libfontconfig1 libpulse0 libpulse-mainloop-glib0

      - name: Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-character-voice.txt --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
          pip install --no-deps infer-rvc-python==1.3.1
          pip install pyinstaller

      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v

      - name: Build the program folder
        run: pyinstaller --noconfirm --clean packaging/alter_ego.spec

      - name: Smoke test (the file-tool server starts from the build)
        run: |
          EXE=dist/AlterEgo/AlterEgo
          [[ "$RUNNER_OS" == "Windows" ]] && EXE=dist/AlterEgo/AlterEgo.exe
          REQUEST='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}'
          REPLY=$(echo "$REQUEST" | timeout 60 "$EXE" --tool-server | head -n 1)
          echo "$REPLY"
          [[ "$REPLY" == *'"serverInfo"'* ]]

      - name: Smoke test (the character voice converter loads in the build)
        run: |
          EXE=dist/AlterEgo/AlterEgo
          [[ "$RUNNER_OS" == "Windows" ]] && EXE=dist/AlterEgo/AlterEgo.exe
          timeout 300 "$EXE" --check-voice | tee check-voice.txt
          grep -q "voice model is there" check-voice.txt

      - name: Package (Windows)
        if: matrix.platform == 'windows'
        run: |
          VERSION=${{ steps.version.outputs.version }}
          if ! command -v iscc >/dev/null 2>&1 && [ ! -f "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" ]; then
            choco install innosetup -y --no-progress
          fi
          "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" "//DAppVersion=$VERSION" packaging/windows/alter_ego.iss
          (cd dist && 7z a -tzip -mx=7 "AlterEgo-v$VERSION-windows-portable.zip" AlterEgo >/dev/null)
          mkdir -p out
          mv "dist/AlterEgo-Setup-v$VERSION.exe" "dist/AlterEgo-v$VERSION-windows-portable.zip" out/

      - name: Package (Linux)
        if: matrix.platform == 'linux'
        run: |
          VERSION=${{ steps.version.outputs.version }}
          NAME="AlterEgo-v$VERSION-linux-x86_64"
          mkdir -p "stage/$NAME" out
          cp -a dist/AlterEgo "stage/$NAME/"
          cp packaging/linux/install.sh packaging/linux/uninstall.sh packaging/linux/alter-ego.desktop \
             packaging/linux/alter-ego.png LICENSE "stage/$NAME/"
          chmod +x "stage/$NAME/install.sh" "stage/$NAME/uninstall.sh" "stage/$NAME/AlterEgo/AlterEgo"
          tar -C stage -czf "out/$NAME.tar.gz" "$NAME"

      - name: Check sizes
        run: |
          ls -l out
          for file in out/*; do
            size=$(stat -c %s "$file" 2>/dev/null || stat -f %z "$file")
            if [ "$size" -ge 2147483648 ]; then
              echo "$file is over GitHub's 2 GB limit for release files" >&2
              exit 1
            fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: alter-ego-${{ matrix.platform }}
          path: out/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Release notes from CHANGELOG.md
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          awk -v tag="$TAG" '
            /^## / { if (found) exit; if (index($0, tag) == 4) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "Download the file for your system below." > notes.md; fi
          cat notes.md

      - uses: softprops/action-gh-release@v2
        with:
          name: Alter Ego ${{ github.ref_name }}
          body_path: notes.md
          files: out/*
          draft: true  # The owner publishes it by hand from the Releases page.
